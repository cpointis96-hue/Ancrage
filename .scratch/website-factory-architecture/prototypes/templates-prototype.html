<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE — Restaurant templates</title>
<style>
:root{--ink:#17201c;--muted:#68736c;--paper:#f7f4ed;--accent:#c96b3d;--line:#ddd8cc;--dark:#21352b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{min-height:100vh;padding:28px 6vw 100px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--muted)}h1,h2,p{margin-top:0}h1{font:clamp(42px,8vw,92px)/.95 Georgia,serif;max-width:800px;margin:26px 0}.sub{max-width:540px;color:var(--muted)}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}.nav a{color:inherit;text-decoration:none;margin-left:18px;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.button{display:inline-block;padding:12px 17px;background:var(--dark);color:white;text-decoration:none;border-radius:999px}.button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:5vw;align-items:center;padding:8vh 0}.photo{min-height:430px;background:linear-gradient(145deg,#e6b579,#6e432d 70%);border-radius:26px;position:relative}.photo span{position:absolute;bottom:20px;left:20px;background:#fff;color:var(--ink);padding:8px 12px;border-radius:999px;font-size:12px}.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.strip div{padding:18px;background:var(--paper)}.menu{padding:60px 0;max-width:900px}.dish{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.dish small{display:block;color:var(--muted)}.dark{background:var(--dark);color:white;margin:0 -6vw;padding:55px 6vw}.dark .sub{color:#ccd6ce}.dark .button{background:#f2c58f;color:var(--ink)}.split{display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:start}.side{border-left:1px solid var(--line);padding-left:26px}.vertical{max-width:680px;margin:auto}.vertical .photo{min-height:330px;border-radius:0}.vertical h1{font-size:clamp(48px,10vw,110px)}.mark{font-size:34px;font-weight:800;letter-spacing:-.06em}.bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#101612;color:#fff;padding:9px 13px;border-radius:999px;box-shadow:0 10px 40px #0003;font-size:13px;z-index:4}.bar button{border:0;background:transparent;color:white;font-size:20px;cursor:pointer}.bar strong{font-size:12px;white-space:nowrap}@media(max-width:700px){main{padding:20px 20px 100px}.hero,.split{grid-template-columns:1fr}.hero{padding:7vh 0 4vh}.photo{min-height:300px}.strip{grid-template-columns:1fr}.dark{margin:0 -20px;padding:45px 20px}.nav a{margin-left:8px}.nav nav a:not(:last-child){display:none}}
</style></head>
<body><main id="app"></main><div class="bar"><button id="prev">‹</button><strong id="label"></strong><button id="next">›</button></div>
<script>
const variants={
 a:{name:'A — Local chaleureux',render:()=>`<div class="nav"><b class="mark">KANDY / TABLE</b><nav><a href="#menu">Menu</a><a href="#place">Le lieu</a><a class="button" href="#book">Réserver</a></nav></div><section class="hero"><div><div class="eyebrow">Cuisine sri-lankaise · Kandy</div><h1>Des plats qui racontent le lieu.</h1><p class="sub">Une table locale, des recettes généreuses et une vue à savourer tranquillement.</p><div class="actions"><a class="button" href="#menu">Voir le menu</a><a class="button alt" href="#place">Nous trouver</a></div></div><div class="photo"><span>Photo authentique du restaurant</span></div></section><div class="strip"><div><b>Ouvert aujourd'hui</b><br><small>11:30 — 22:00</small></div><div><b>À Kandy</b><br><small>Itinéraire en 1 clic</small></div><div><b>Réserver</b><br><small>Réponse rapide</small></div></div><section class="menu" id="menu"><div class="eyebrow">Le menu</div><h2>Nos signatures</h2><div class="dish"><span><b>Kottu maison</b><small>Parfumé, généreux, préparé à la minute</small></span><b>1 800 LKR</b></div><div class="dish"><span><b>Rice & curry</b><small>Une sélection de recettes du jour</small></span><b>2 200 LKR</b></div></section>`},
 b:{name:'B — Premium gastronomique',render:()=>`<div class="nav"><span class="eyebrow">EST. 2018 · COLOMBO</span><nav><a href="#story">Notre histoire</a><a href="#menu">Menu</a><a href="#book">Book a table</a></nav></div><section class="split" style="padding:12vh 0"><div><div class="eyebrow">The seasonal table</div><h1>Simple ingredients.<br><i>Deep memory.</i></h1><p class="sub">A considered restaurant experience in the heart of Colombo, shaped by the island and the seasons.</p><div class="actions"><a class="button" href="#book">Reserve your table</a></div></div><div class="photo"></div></section><section class="dark"><div class="split"><div><div class="eyebrow">Tonight's menu</div><h2>Island produce, quietly elevated.</h2></div><div><p class="sub">A concise menu built around local fishermen, growers and the rhythm of the market.</p><a class="button" href="#menu">Explore the menu</a></div></div></section>`},
 c:{name:'C — Tropical expérience',render:()=>`<div class="vertical"><div class="nav"><b class="mark">PALM / FIRE</b><nav><a href="#menu">Menu</a><a href="#book">Book</a></nav></div><div class="photo" style="margin-top:22px"><span>Fresh from the coast</span></div><section style="padding:35px 0 60px"><div class="eyebrow">Mirissa · Sri Lanka</div><h1>Eat close to the ocean.</h1><p class="sub">Fresh seafood, tropical plates and sunset tables made for slow evenings.</p><div class="actions"><a class="button" href="#menu">See today's plates</a><a class="button alt" href="#place">Get directions</a></div></section><section class="dark" style="margin:0 -30px;padding:40px 30px"><div class="eyebrow">Popular today</div><h2>Grilled lagoon prawns</h2><p class="sub">Local prawns, lime, coconut sambal — served with the evening breeze.</p></section></div>`}
};
const keys=Object.keys(variants);let current=new URLSearchParams(location.search).get('variant')||'a';if(!variants[current])current='a';function draw(){document.querySelector('#app').innerHTML=variants[current].render();document.querySelector('#label').textContent=variants[current].name;history.replaceState({},'',`?variant=${current}`)}function move(n){current=keys[(keys.indexOf(current)+n+keys.length)%keys.length];draw()}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.onkeydown=e=>{if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&e.key==='ArrowLeft')move(-1);if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&e.key==='ArrowRight')move(1)};draw();
</script></body></html>
