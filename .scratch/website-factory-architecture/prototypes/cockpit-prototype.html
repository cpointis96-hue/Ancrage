<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROTOTYPE — Cockpit</title><style>
:root{--bg:#f3f5f2;--ink:#17211c;--muted:#748078;--line:#dce2dc;--card:#fff;--green:#244c3a;--amber:#c77831;--red:#b34a42}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#17241e;color:#dfe9e1;padding:24px 16px}.brand{font-size:20px;font-weight:800;letter-spacing:-.04em;margin-bottom:42px}.side a{display:block;color:inherit;text-decoration:none;padding:11px 12px;border-radius:8px;margin:4px 0}.side a.active,.side a:hover{background:#2c4d3d}.main{padding:28px 4vw 100px;max-width:1400px;width:100%}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:25px}.kicker{text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--muted)}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.05em;margin:7px 0}.muted{color:var(--muted)}.button{border:0;background:var(--green);color:#fff;padding:10px 14px;border-radius:7px;cursor:pointer}.button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px}.metric b{display:block;font-size:28px;margin-top:8px}.metric small{color:var(--muted)}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.panel h2{font-size:16px;margin:0 0 15px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.status{font-size:12px;padding:4px 8px;border-radius:999px;background:#e7f2e8;color:#27643b}.status.warn{background:#fff0d9;color:#9b5b11}.status.block{background:#ffe1df;color:#9c332d}.progress{height:7px;background:#e5e9e5;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#5b9b76}.preview{min-height:235px;background:linear-gradient(145deg,#dfb272,#60402c);border-radius:9px;display:flex;align-items:end;padding:14px;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.navtabs{display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:20px}.navtabs a{padding:10px 4px;text-decoration:none;color:var(--muted);white-space:nowrap}.navtabs a:first-child{color:var(--ink);border-bottom:2px solid var(--green)}.bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#101612;color:#fff;padding:9px 13px;border-radius:999px;box-shadow:0 10px 40px #0003;z-index:5}.bar button{border:0;background:transparent;color:white;font-size:20px;cursor:pointer}.bar strong{font-size:12px;white-space:nowrap}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:flex;align-items:center;gap:12px;padding:12px 16px;overflow:auto}.brand{margin:0 20px 0 0}.side a{white-space:nowrap;margin:0}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.main{padding:20px 16px 100px}}
</style></head><body><div id="app"></div><div class="bar"><button id="prev">‹</button><strong id="label"></strong><button id="next">›</button></div><script>
const variants={a:{name:'A — Action immédiate',render:()=>`<div class="shell"><aside class="side"><div class="brand">FACTORY</div><a class="active">Vue d'ensemble</a><a>Démos</a><a>Demandes</a><a>Production</a><a>Agents</a><a>Coûts</a></aside><main class="main"><div class="top"><div><div class="kicker">Aujourd'hui · 20 août 2026</div><h1>Bonjour, voici ce qui mérite ton attention.</h1><p class="muted">Une vue courte, orientée décisions.</p></div><button class="button">+ Nouvelle recherche</button></div><div class="grid"><div class="metric"><small>Nouvelles demandes</small><b>08</b></div><div class="metric"><small>Démos à vérifier</small><b>03</b></div><div class="metric"><small>Erreurs bloquantes</small><b>01</b></div><div class="metric"><small>Coût moyen / démo</small><b>0,42 €</b></div></div><div class="two"><section class="panel"><h2>À traiter maintenant</h2><div class="row"><span><b>Ocean Spice, Mirissa</b><br><small class="muted">Démo prête · 2 warnings</small></span><span class="status warn">Vérifier</span></div><div class="row"><span><b>Green Mango, Kandy</b><br><small class="muted">Bloquée à l'enrichissement</small></span><span class="status block">Ouvrir</span></div><div class="row"><span><b>Lake View Café</b><br><small class="muted">Upload corrigé reçu</small></span><span class="status">QA</span></div></section><section class="panel"><h2>Santé du pipeline</h2><p class="muted">7 / 8 démos dans le délai</p><div class="progress"><span style="width:87%"></span></div><p class="muted" style="margin-top:25px">Aucun budget dépassé</p><div class="actions"><button class="button alt">Voir les logs</button></div></section></div></main></div>`},
b:{name:'B — File de décisions',render:()=>`<div class="shell"><aside class="side"><div class="brand">FACTORY</div><a class="active">File de décisions</a><a>Demandes</a><a>Sites</a><a>Bibliothèque</a><a>Réglages</a></aside><main class="main"><div class="top"><div><div class="kicker">Cockpit opérateur</div><h1>Ta file de décisions</h1><p class="muted">Les agents travaillent. Tu interviens seulement quand ton jugement est nécessaire.</p></div><button class="button alt">Filtrer</button></div><div class="navtabs"><a>À vérifier (3)</a><a>Bloqués (1)</a><a>En attente (4)</a><a>Terminés</a></div><div class="two"><section class="panel"><div class="row"><span><b>Ocean Spice</b><br><small class="muted">Validation finale · Sri Lanka</small></span><span class="status warn">2 WARN</span></div><div class="preview"><b>Voir l'aperçu de la démo</b></div><p class="muted">Sources, coût 0,42 €, QA 31/31, aucun blocage.</p><div class="actions"><button class="button">Valider la démo</button><button class="button alt">Ouvrir dans Codex</button></div></section><section class="panel"><h2>Résumé de la demande</h2><div class="row"><span class="muted">Photos</span><b>5 / 5</b></div><div class="row"><span class="muted">Menu</span><b>Vérifié</b></div><div class="row"><span class="muted">Email</span><b>Présent</b></div><div class="row"><span class="muted">Délai</span><b>42 min</b></div></section></div></main></div>`},
c:{name:'C — Contrôle global',render:()=>`<div class="shell"><aside class="side"><div class="brand">FACTORY</div><a class="active">Overview</a><a>Workflows</a><a>Quality gates</a><a>Cost ledger</a><a>Configuration</a></aside><main class="main"><div class="top"><div><div class="kicker">Control plane</div><h1>Le système est sous contrôle.</h1><p class="muted">État global, coûts et exceptions sur un même écran.</p></div><button class="button">Inspecter les gates</button></div><div class="grid"><div class="metric"><small>Workflows actifs</small><b>14</b></div><div class="metric"><small>Gates passés</small><b>96%</b></div><div class="metric"><small>Coût du mois</small><b>8,60 €</b></div><div class="metric"><small>Incidents ouverts</small><b>02</b></div></div><div class="two"><section class="panel"><h2>Pipeline</h2><div class="row"><span>Enrichissement</span><span class="status">24 OK</span></div><div class="row"><span>Analyse SEO</span><span class="status">21 OK</span></div><div class="row"><span>Composition SiteSpec</span><span class="status warn">2 warnings</span></div><div class="row"><span>QA finale</span><span class="status block">1 bloquée</span></div></section><section class="panel"><h2>Budget par fournisseur</h2><div class="row"><span>Neon</span><b>1,20 €</b></div><div class="row"><span>Cloud IA</span><b>5,10 €</b></div><div class="row"><span>R2 / CDN</span><b>0,30 €</b></div><div class="row"><span>Autres</span><b>2,00 €</b></div></section></div></main></div>`}};
const keys=Object.keys(variants);let current=new URLSearchParams(location.search).get('variant')||'a';if(!variants[current])current='a';function draw(){document.querySelector('#app').innerHTML=variants[current].render();document.querySelector('#label').textContent=variants[current].name;history.replaceState({},'',`?variant=${current}`)}function move(n){current=keys[(keys.indexOf(current)+n+keys.length)%keys.length];draw()}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.onkeydown=e=>{if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&e.key==='ArrowLeft')move(-1);if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&e.key==='ArrowRight')move(1)};draw();
</script></body></html>
