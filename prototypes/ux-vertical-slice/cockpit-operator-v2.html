const prompts=[['AuditAnalyst','Audit initial','OpenAI · gpt-4.1-mini','v3','ACTIF'],['Copywriter','Génération de démo','Anthropic · claude-sonnet-4-20250514','v2','BROUILLON']];

function badge(s){return `<span class="status ${['PASS','ACTIF','READY'].includes(s)?'pass':['WARN','PARTIAL','BROUILLON','VIDE'].includes(s)?'warn':'block'}">${s}</span>`}function act(message){notice=message;renderDetail()}function iconButton(label,svg,fn){return `<button class="btn icon-action" type="button" aria-label="${label}" title="${label}" onclick="${fn}"><svg viewBox="0 0 24 24" aria-hidden="true">${svg}</svg></button>`}
nav.forEach(([id,label,group])=>{const b=document.createElement('button');b.dataset.id=id;b.innerHTML=`<span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true">${icon(id)}</svg></span><span class="nav-label">${label}</span>`;b.onclick=()=>{current=id;selected=0;tab=id==='config'?'workflows':'overview';render()};$('#'+group).append(b)});$('.brand').onclick=()=>{current='inbox';selected=0;tab='overview';render()};
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===current));current==='config'?configPage():current==='providers'?providersPage():current==='internet'?internetPage():current==='runs'?runsPage():current==='dossiers'?dossiersPage():inboxPage()}
function listHead(kicker,title,count){return `<div class="eyebrow">${kicker}</div><div class="head"><div class="h1">${title}</div>${count?`<span class="status pass">${count}</span>`:''}</div>`}
function inboxPage(){const items=[{site:'Maison Rive',action:'Voir les corrections',state:'WARN',phase:'Validation finale',checks:[['Liens internes','PASS'],['Mobile 390 px','PASS'],['Accessibilité','WARN']]},{site:'Bistro Sillage',action:'Confirmer l’adresse',state:'BLOCK',phase:'Dossier incomplet',checks:[['Adresse établissement','BLOCK']]},{site:'Atelier Noma',action:'Valider le site',state:'PASS',phase:'Validation finale',checks:[['Liens internes','PASS'],['Mobile 390 px','PASS'],['Accessibilité','PASS']]}];const x=items[selected];const ready=x.state==='PASS';$('#list').innerHTML=listHead('Opérations','À traiter')+items.map((item,i)=>`<button class="row ${i===selected?'active':''}" onclick="selected=${i};render()"><div class="rowtop"><strong>${item.site}</strong>${badge(item.state)}</div><div class="meta">${item.action}</div></button>`).join('');$('#detail').innerHTML=`<div class="detail-inner"><header class="inspect-head"><div><h2>${x.site}</h2><div class="muted">${x.phase}</div></div><div class="actions"><button class="btn primary" onclick="act('${ready?'Validation finale préparée pour':'Action préparée pour'} ${x.site}')">${x.action}</button>${iconButton('Ouvrir le dossier','<path d="M3 5.5h5l1.5 1.7H21v10.3H3z"/><path d="M3 5.5V4h5l1.5 1.5"/>',`act('Dossier ouvert pour ${x.site}')`)}</div></header><div class="panel"><div class="section-label">À faire</div><strong>${x.action}</strong></div><div class="panel"><div class="section-label">Contrôles avant envoi</div>${x.checks.map(check=>`<div class="step"><span class="status-dot ${check[1]==='PASS'?'pass':check[1]==='WARN'?'warn':'block'}" role="img" aria-label="${check[1]}" title="${check[1]}"></span><strong>${check[0]}</strong></div>`).join('')}</div>${notice?`<div class="notice">${esc(notice)}</div>`:''}</div>`}
function runsPage(){const r=runs[selected];$('#list').innerHTML=listHead('Opérations','Runs',runs.length+' runs')+'<input class="search" placeholder="Rechercher un run ou un établissement"><div class="section-label">Exécutions</div>'+runs.map((x,i)=>`<button class="row ${i===selected?'active':''}" onclick="selected=${i};tab='overview';render()"><div class="rowtop"><strong>${x.id} · ${x.site}</strong>${badge(x.state)}</div><div class="meta"><span>${x.step}</span><span>${x.cost}</span></div></button>`).join('');renderDetail()}
function renderDetail(){const r=runs[selected];if(current!=='runs')return;const checkpoint=[...r.steps].reverse().find(s=>s[2]==='PASS')||r.steps[0];const pending=r.steps.filter(s=>s[2]==='EN ATTENTE');const content=`<section class="facts"><div class="fact"><small>Étape en cours</small><strong>${r.step}</strong></div><div class="fact"><small>Statut</small><strong>${badge(r.state)}</strong></div><div class="fact"><small>Checkpoint fiable</small><strong>${checkpoint[0]} · ${checkpoint[3]}</strong></div><div class="fact"><small>Tentatives · coût</small><strong>${r.attempts} · ${r.cost}</strong></div></section><div class="panel"><div class="section-label">Progression</div>${r.steps.map(s=>`<div class="step"><b>${s[0]}</b><strong>${s[1]}</strong><span class="step-detail muted">${s[3]}</span>${s[2]==='BLOQUÉ'?badge('BLOCK'):s[2]==='PASS'?badge('PASS'):`<span class="status">${s[2]}</span>`}</div>`).join('')}</div><div class="panel"><div class="section-label">Configuration et preuves</div><div class="grid"><div><small class="muted">Provider · modèle</small><strong>${r.provider}</strong></div><div><small class="muted">Prompt · version</small><strong>${r.prompt}</strong></div><div><small class="muted">Sortie du checkpoint</small><strong>${checkpoint[3]}</strong></div><div><small class="muted">À venir</small><strong>${pending.length?pending.map(s=>s[0]).join(' · '):'Aucune'}</strong></div></div></div><div class="notice ${r.state==='BLOCK'||r.state==='WARN'?'warn':''}">${r.state==='BLOCK'?'Budget atteint · aucune reprise automatique.':r.state==='WARN'?'Adresse requise avant reprise.':'Checkpoint fiable conservé.'}</div>`;$('#detail').innerHTML=`<div class="detail-inner"><header class="inspect-head"><div><div class="eyebrow">Run · ${r.id}</div><h2>${r.site}</h2><div class="muted">${r.step}</div></div><div class="actions">${r.state==='BLOCK'?'<button class="btn primary" onclick="act(\'Budget inspecté · reprise interdite\')">Inspecter le budget</button>':'<button class="btn primary" onclick="act(\'Relance préparée depuis le dernier checkpoint\')">Reprendre</button>'}${iconButton('Ouvrir le contexte local','<path d="M3 5.5h5l1.5 1.7H21v10.3H3z"/><path d="M3 5.5V4h5l1.5 1.5"/>',`act('Contexte local ouvert pour ${r.id}')`)}</div></header>${content}${notice?`<div class="notice">${esc(notice)}</div>`:''}</div>`}
function dossiersPage(){const d=dossiers[selected];$('#list').innerHTML=listHead('Opérations','Dossiers',dossiers.length+' dossiers')+'<input class="search" placeholder="Rechercher un dossier"><div class="section-label">Dossiers suivis</div>'+dossiers.map((x,i)=>`<button class="row ${i===selected?'active':''}" onclick="selected=${i};render()"><div class="rowtop"><strong>${x[0]}</strong>${badge(x[1])}</div><div class="meta">${x[2]}</div></button>`).join('');$('#detail').innerHTML=`<div class="detail-inner"><header class="inspect-head"><div><div class="eyebrow">Dossier · identité et provenance</div><h2>${d[0]}</h2><div class="muted">${d[2]}</div></div><div class="actions"><button class="btn primary" onclick="act('${d[1]==='PASS'?'Dossier déjà synchronisé':'Synchronisation préparée'}')">${d[1]==='PASS'?'Ouvrir la source':'Synchroniser'}</button>${iconButton('Ouvrir le dossier local','<path d="M3 5.5h5l1.5 1.7H21v10.3H3z"/><path d="M3 5.5V4h5l1.5 1.5"/>',`act('Dossier local ouvert pour ${d[0]}')`)}</div></header><nav class="tabs">${[['overview','Identité'],['sources','Sources & médias'],['sync','Provenance']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</nav><section class="facts"><div class="fact"><small>État</small><strong>${badge(d[1])}</strong></div><div class="fact"><small>Complétude</small><strong>${d[3]}</strong></div><div class="fact"><small>Sources</small><strong>${d[4].split(' · ')[0]}</strong></div><div class="fact"><small>Médias</small><strong>${d[4].split(' · ')[1]}</strong></div></section><div class="panel"><div class="section-label">${tab==='sources'?'Sources et droits':tab==='sync'?'Dernière synchronisation':'État du dossier'}</div><p>${tab==='sources'?'Sources datées conservées · droits médias visibles avant usage.':tab==='sync'?'Hash local concordant ou contrôle à poursuivre selon le statut.':'Identité, complétude et provenance déterminent la prochaine action.'}</p></div>${notice?`<div class="notice">${esc(notice)}</div>`:''}</div>`}
function configPage(){const names=[['workflows','Workflows'],['prompts','Prompts'],['contracts','Contrats'],['cli','Profils CLI']];const heading=tab==='workflows'?'Workflows disponibles':tab==='prompts'?'Prompts utilisés':tab==='contracts'?'Contrats de données':'Profils autorisés';const rows=tab==='workflows'?workflows.map((x,i)=>`<button class="row ${i===selected?'active':''}" onclick="selected=${i};render()"><div class="rowtop"><strong>${x.name}</strong>${badge(x.status)}</div><div class="meta">${x.steps.length} étapes configurées</div></button>`).join(''):tab==='prompts'?prompts.map((x,i)=>`<button class="row ${i===selected?'active':''}" onclick="selected=${i};render()"><div class="rowtop"><strong>${x[0]}</strong>${badge(x[4])}</div><div class="meta">${x[1]} · ${x[3]}</div></button>`).join(''):tab==='contracts'?contracts.map((x,i)=>`<button class="row ${i===selected?'active':''}" onclick="selected=${i};render()"><div class="rowtop"><strong>${x[0]}</strong></div><div class="meta">${x[1]}</div></button>`).join(''):cliProfiles.map((x,i)=>`<button class="row ${i===selected?'active':''}" onclick="selected=${i};render()"><div class="rowtop"><strong>${x[0]}</strong>${badge(x[3])}</div><div class="meta">${x[1]} · ${x[2]}</div></button>`).join('');$('#list').innerHTML=listHead('Configuration','Configuration','4 vues')+`<nav class="tabs">${names.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</nav><div class="section-label">${heading}</div>`+rows;configDetail()}
function configDetail(){let title='',body='';if(tab==='workflows'){const w=workflows[selected]||workflows[0];title=w.name;body=`<div class="panel"><div class="section-label">Étapes dans l'ordre</div>${w.steps.length?w.steps.map(s=>`<div class="step"><b>${s[0]}</b><strong>${s[1]}</strong><span class="step-detail muted">${s[2]} · entrée : ${s[3]} · sortie : ${s[4]}</span>${iconButton('Modifier '+s[0],'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 6 4 4"/>',`act('Étape ${s[0]} ouverte en modification')`)}</div>`).join(''):'<div class="notice">Aucune étape. Ajoute une étape pour rendre ce workflow opérable.</div>'}</div>`}else if(tab==='prompts'){const p=prompts[selected]||prompts[0];title=p[0];body=`<div class="panel"><div class="grid"><div><small class="muted">Workflow propriétaire</small><strong>${p[1]}</strong></div><div><small class="muted">Provider / modèle</small><strong>${p[2]}</strong></div><div><small class="muted">Version active</small><strong>${p[3]}</strong></div><div><small class="muted">Statut</small><strong>${badge(p[4])}</strong></div></div><div class="field"><label>Prompt versionné</label><textarea>Travaille uniquement à partir des entrées autorisées. Sépare faits, interprétations et limites. Retourne le contrat attendu.</textarea></div><div class="actions">${iconButton('Tester le prompt','<path d="M8 3h8M10 3v4l-4.5 9.5A2 2 0 0 0 7.3 19h8.4a2 2 0 0 0 1.8-2.5L13 7V3"/><path d="M8 13h8"/>',`act('Test isolé préparé pour ${p[0]}')`)}<button class="btn primary" onclick="act('Nouvelle version préparée sans modifier les runs existants')">Créer une version</button></div></div>`}else if(tab==='contracts'){const c=contracts[selected]||contracts[0];title=c[0];body=`<div class="panel"><div class="grid"><div><small class="muted">Entrées</small><strong>${c[1]}</strong></div><div><small class="muted">Sorties</small><strong>${c[2]}</strong></div><div><small class="muted">Réutilisé par</small><strong>${c[3]}</strong></div><div><small class="muted">Validation</small><strong>Schéma obligatoire</strong></div></div></div>`}else{const c=cliProfiles[selected]||cliProfiles[0];title=c[0];body=`<div class="panel"><div class="grid"><div><small class="muted">Étape autorisée</small><strong>${c[1]}</strong></div><div><small class="muted">Timeout</small><strong>${c[2]}</strong></div><div><small class="muted">État</small><strong>${badge(c[3])}</strong></div><div><small class="muted">Réseau</small><strong>Site cible uniquement</strong></div></div><div class="actions">${iconButton('Tester le profil CLI','<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/>',`act('Test du profil ${c[0]} préparé')`)}<button class="btn primary" onclick="createCliProfile()">Ajouter un profil CLI</button></div></div>`}$('#detail').innerHTML=`<div class="detail-inner"><header class="inspect-head"><div><div class="eyebrow">Configuration · ${tab}</div><h2>${title}</h2><div class="muted">Le contrôle agit sur la configuration utilisée par les futurs runs.</div></div><div class="actions">${iconButton('Dupliquer la configuration','<path d="M8 8h11v12H8z"/><path d="M5 16H3V4h12v2"/>',`act('Configuration dupliquée en brouillon')`)}${iconButton('Voir les versions','<path d="M6 4h12M6 8h8M6 12h12M6 16h8"/>',`act('Historique des versions ouvert')`)}</div></header>${body}${notice?`<div class="notice">${esc(notice)}</div>`:''}</div>`}
function providersPage(){
  $('#list').innerHTML='<div class="provider-list-head">Providers</div>';
