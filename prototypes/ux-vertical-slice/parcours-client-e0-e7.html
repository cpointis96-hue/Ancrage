<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ancrage - prototype du parcours client E0 à E7</title>
  <style>
    :root{color-scheme:dark;--bg:#102119;--surface:#1d362b;--surface-2:#203d31;--ink:#f1f4eb;--muted:#aec0b3;--line:#496456;--accent:#e0a481;--good:#a8d0ae;--warn:#e6c27e;--danger:#ef9d96;font:15px/1.55 "JetBrains Mono","SFMono-Regular",monospace}
    *{box-sizing:border-box}body{margin:0;background:#0d1712;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,100%);min-height:100dvh;margin:auto;padding:18px 22px 104px}.prototype-bar{position:sticky;z-index:5;top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 42px;padding:8px 10px 8px 14px;border:1px solid #315142;border-radius:999px;background:#0d1913eF;box-shadow:0 10px 30px #0004;color:var(--muted);font-size:12px}.prototype-bar label{white-space:nowrap}.prototype-bar select{min-width:215px;border:0;border-radius:8px;padding:7px 10px;background:#294b3b;color:var(--ink)}.frame{border-top:1px solid var(--line);padding-top:22px}.brand-row{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:0 0 22px;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:700;letter-spacing:-.08em}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.11em;text-transform:uppercase}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:28px 0 52px}.progress-item{position:relative;padding-top:12px;color:#708678;font-size:10px}.progress-item:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:#3a5144}.progress-item.done{color:var(--good)}.progress-item.done:before{background:var(--good)}.progress-item.current{color:var(--ink)}.progress-item.current:before{background:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:clamp(28px,7vw,88px);align-items:start}.main h1{max-width:760px;margin:10px 0 18px;font-size:clamp(36px,6vw,72px);line-height:.98;letter-spacing:-.065em}.lede{max-width:650px;color:var(--muted);font-size:17px}.panel{border:1px solid var(--line);background:var(--surface);padding:clamp(20px,4vw,34px)}.side-note{position:sticky;top:88px}.side-note p{color:var(--muted)}.field{display:grid;gap:8px;margin:24px 0}.field label{font-weight:650}.field input,.field textarea{width:100%;border:1px solid #6d8a79;border-radius:3px;padding:13px 14px;background:#eff5ef;color:#17201d}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field textarea:focus{outline:3px solid #e0a48166;border-color:var(--accent)}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:4px;padding:10px 16px}.primary{border:1px solid var(--accent);background:var(--accent);color:#17201d;font-weight:700}.primary:disabled{cursor:not-allowed;opacity:.45}.secondary{border:0;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:4px}.action-row{display:flex;align-items:center;gap:18px;margin-top:26px}.choice-list{display:grid;gap:8px;margin:24px 0}.choice{display:grid;grid-template-columns:20px 1fr;gap:12px;width:100%;border:1px solid var(--line);padding:15px;text-align:left;background:var(--surface-2);color:var(--ink)}.choice[aria-checked=true]{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.radio{width:18px;height:18px;border:1px solid #aebcaf;border-radius:50%}.choice[aria-checked=true] .radio{border:5px solid var(--accent)}.choice small{display:block;margin-top:3px;color:var(--muted)}.meta-list{display:grid;margin:24px 0}.meta-list div{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line)}.meta-list dt{color:var(--muted)}.meta-list dd{margin:0;text-align:right;font-weight:650}.status{font-size:11px;letter-spacing:.05em;text-transform:uppercase}.pass{color:var(--good)}.warn{color:var(--warn)}.block{color:var(--danger)}.report{display:grid;gap:0;margin-top:22px}.report-block{padding:18px 0;border-bottom:1px solid var(--line)}.report-block p{margin:5px 0 0;color:var(--muted)}.step-list{display:grid;gap:8px;margin:22px 0}.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #ffffff14}.step-mark{display:grid;place-items:center;flex:0 0 auto;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;font-size:11px}.step.done .step-mark{border-color:var(--good);color:var(--good)}.step.current .step-mark{border-color:var(--accent);color:var(--accent)}.step small{display:block;color:var(--muted)}.notice{margin:20px 0;padding:13px 15px;border-left:3px solid var(--accent);background:#e0a48116;color:var(--muted)}.notice strong{color:var(--ink)}.check{display:flex;gap:10px;align-items:flex-start;margin:18px 0;color:var(--muted);font-size:13px}.check input{margin-top:5px;accent-color:var(--accent)}.stage-copy{max-width:660px;margin:28px 0 0;color:var(--muted)}.stage-copy strong{color:var(--ink)}.source{display:inline-block;margin-left:8px;color:var(--muted);font-size:11px}.demo-preview{display:grid;grid-template-columns:1.1fr .9fr;min-height:210px;margin:24px 0;background:#15291f;border:1px solid var(--line)}.demo-image{min-height:210px;background:url("../sstr-direction/assets/brand-rock.png") 65% center/cover no-repeat}.demo-copy{padding:24px}.demo-copy strong{display:block;margin-top:28px;font-size:25px;line-height:1.05;letter-spacing:-.05em}.expiry{color:var(--muted);font-size:12px}.error{color:var(--danger);font-size:13px}.hidden{display:none!important}@media(max-width:760px){.shell{padding:12px 16px 104px}.prototype-bar{top:8px;margin-bottom:30px}.prototype-bar select{min-width:0;max-width:180px}.brand-row{align-items:flex-start;flex-direction:column;gap:8px}.progress{gap:3px;margin:24px 0 38px}.progress-item{overflow:hidden;font-size:9px;text-overflow:ellipsis;white-space:nowrap}.layout{display:block}.side-note{position:static;margin-top:26px}.main h1{font-size:clamp(38px,11vw,56px)}.lede{font-size:15px}.panel{padding:20px}.action-row{align-items:stretch;flex-direction:column;gap:10px}.action-row .primary{width:100%}.meta-list div{align-items:flex-start;flex-direction:column;gap:4px}.meta-list dd{text-align:left}.demo-preview{grid-template-columns:1fr}.demo-image{min-height:190px}.demo-copy strong{margin-top:14px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="prototype-bar"><label for="screen">Parcours client</label><select id="screen" aria-label="Choisir un écran"></select></div>
    <div class="frame" id="app"></div>
  </main>
  <script>
    const screens=[
      {id:'E0',name:'Entrée',step:0,title:'Comprendre ce que votre présence locale peut améliorer.',lede:'Un diagnostic clair d’abord. Une démo de votre site ensuite. Aucun compte ni paiement pour commencer.',main:()=>`<div class="field"><label for="name">Nom de l’établissement</label><input id="name" placeholder="Ex. votre restaurant"></div><div class="field"><label for="city">Ville</label><input id="city" placeholder="Choisissez une ville dans la liste"></div><p class="notice"><strong>Pour commencer :</strong> nous avons seulement besoin du nom et d’une ville structurée.</p><div class="action-row"><button class="primary" data-next="E1">Rechercher mon établissement</button></div>`,side:'La recherche sert à éviter les homonymes et à montrer les sources utilisées. Aucune fiche ne sera présentée comme confirmée sans preuve.'},
      {id:'E1',name:'Identité',step:0,title:'Vérifier que nous regardons le bon établissement.',lede:'La correspondance n’est pas encore confirmée. Choisissez une fiche, ou indiquez que vous ne la reconnaissez pas.',main:()=>`<div class="eyebrow">Correspondances trouvées</div><div class="choice-list" role="radiogroup" aria-label="Établissements trouvés"><button class="choice" role="radio" aria-checked="false" data-choice type="button"><span class="radio"></span><span><strong>Établissement exemple A</strong><small>Adresse publique trouvée · source locale</small></span></button><button class="choice" role="radio" aria-checked="false" data-choice type="button"><span class="radio"></span><span><strong>Établissement exemple B</strong><small>Ville correspondante · adresse à confirmer</small></span></button></div><div class="action-row"><button class="primary" data-next="E2" disabled id="confirm">Continuer avec cet établissement</button><a class="secondary" href="#" data-next="E0">Je ne le vois pas</a></div>`,side:'La sélection d’une fiche est une décision visible. Une seule action de confirmation apparaît après la sélection.'},
      {id:'E2',name:'Dossier',step:1,title:'Compléter seulement ce qui manque.',lede:'Les données trouvées restent visibles avec leur source. Les champs critiques bloquent la suite ; les autres restent facultatifs.',main:()=>`<div class="meta-list"><div><dt>Nom affiché</dt><dd>Établissement exemple A <span class="status pass">observé</span><span class="source">source locale</span></dd></div><div><dt>Ville</dt><dd>Ville exemple <span class="status pass">observée</span></dd></div><div><dt>Adresse</dt><dd>À confirmer <span class="status warn">manquant</span></dd></div></div><div class="field"><label for="address">Adresse utile à la démo</label><input id="address" placeholder="Numéro, rue, quartier"><small class="eyebrow">Ce champ bloque la génération d’une démo fiable.</small></div><div class="field"><label for="photos">Photos du lieu</label><input id="photos" type="file" accept="image/*" multiple><small class="eyebrow">Prototype : cinq catégories à couvrir, aperçu et droits seront contrôlés ici.</small></div><div class="action-row"><button class="primary" data-next="E3">Voir l’avancement de mon audit</button><a class="secondary" href="#" data-next="E1">Revenir à l’identité</a></div>`,side:'Chaque donnée importante porte sa qualification. Une information observée, calculée ou inconnue ne doit pas être présentée de la même façon.'},
      {id:'E3',name:'Audit',step:2,title:'Votre audit progresse par preuves.',lede:'Le rapport local est disponible dès qu’un checkpoint est validé. L’analyse SEO continue sans bloquer la première valeur.',main:()=>`<div class="step-list"><div class="step done"><span class="step-mark">✓</span><p><strong>Identifier</strong><small>Établissement confirmé, source conservée.</small></p></div><div class="step done"><span class="step-mark">✓</span><p><strong>Comprendre</strong><small>Périmètre et signaux publics réunis.</small></p></div><div class="step current"><span class="step-mark">3</span><p><strong>Auditer</strong><small>Rapport GMB disponible, analyse SEO en cours.</small></p></div><div class="step"><span class="step-mark">4</span><p><strong>Préparer</strong><small>Disponible après dossier complet.</small></p></div><div class="step"><span class="step-mark">5</span><p><strong>Découvrir</strong><small>Démo privée après validation opérateur.</small></p></div></div><div class="notice"><strong>Rapport partiel disponible.</strong> Vous pouvez consulter les premiers constats pendant que l’analyse SEO continue.</div><div class="action-row"><button class="primary" data-next="E4">Consulter le rapport</button></div>`,side:'La progression indique des checkpoints réels. Elle ne transforme pas une animation en preuve et n’affiche pas de pourcentage inventé.'},
      {id:'E4',name:'Rapport',step:2,title:'Voici ce qui mérite votre attention.',lede:'Un résumé actionnable, les preuves disponibles et les limites de l’audit, dans cet ordre.',main:()=>`<div class="report"><div class="report-block"><strong>Résumé</strong><p>Deux points à vérifier sur la présence locale. L’analyse SEO technique est encore partielle.</p></div><div class="report-block"><strong>Établissement et périmètre</strong><p>Établissement exemple A, ville exemple. Observation publique datée dans le prototype.</p></div><div class="report-block"><strong>Présence locale</strong><p><span class="status warn">2 warnings</span> Fiche et adresse à confirmer avec la source.</p></div><div class="report-block"><strong>Limites et sources</strong><p>Les éléments manquants restent identifiés. Aucun résultat ne promet une position ou un revenu.</p></div></div><div class="action-row"><button class="primary" data-next="E5">Préparer mon site</button><a class="secondary" href="#">Télécharger le rapport PDF</a></div>`,side:'Quand le dossier est incomplet, l’action primaire devient « Compléter mon dossier ». Ici, le prototype montre le chemin complet après rapport exploitable.'},
      {id:'E5',name:'E-mail',step:3,title:'Préparer votre démo sans créer de compte.',lede:'Nous utiliserons cette adresse uniquement pour vous envoyer le lien de votre démo après vérification.',main:()=>`<div class="field"><label for="email">Adresse e-mail</label><input id="email" type="email" placeholder="vous@exemple.com"><small class="eyebrow">Cette adresse est demandée juste avant le lancement de la préparation.</small></div><label class="check"><input type="checkbox"> <span>Je souhaite recevoir occasionnellement des informations utiles. Cette case est facultative.</span></label><div class="step-list"><div class="step current"><span class="step-mark">1</span><p><strong>Préparer les informations</strong><small>Snapshot du dossier et des sources.</small></p></div><div class="step"><span class="step-mark">2</span><p><strong>Construire</strong><small>La génération n’a pas encore commencé.</small></p></div><div class="step"><span class="step-mark">3</span><p><strong>Contrôler</strong><small>Une validation opérateur précédera l’envoi.</small></p></div></div><p class="error hidden" id="email-error">Saisissez une adresse e-mail valide pour lancer la préparation.</p><div class="action-row"><button class="primary" id="launch">Lancer la préparation</button><a class="secondary" href="#" data-next="E4">Revenir au rapport</a></div>`,side:'Le clic déclenche réellement la préparation seulement après une adresse valide. Une erreur ne fait pas perdre le rapport.'},
      {id:'E6',name:'Attente',step:3,title:'Votre démo est en cours de vérification.',lede:'Les informations sont préparées. La démo ne sera visible qu’après les contrôles et la validation opérateur.',main:()=>`<div class="notice"><strong>Dernière mise à jour :</strong> il y a quelques secondes. L’animation n’est pas utilisée comme preuve d’avancement.</div><div class="step-list"><div class="step done"><span class="step-mark">✓</span><p><strong>Préparer les informations</strong><small>Snapshot du dossier confirmé.</small></p></div><div class="step current"><span class="step-mark">2</span><p><strong>Construire</strong><small>Le rendu de la démo est en cours.</small></p></div><div class="step"><span class="step-mark">3</span><p><strong>Contrôler</strong><small>QA et décision opérateur à venir.</small></p></div></div><div class="action-row"><button class="primary" data-next="E7">Découvrir ma démo</button></div>`,side:'Les états retry, partial et blocked doivent remplacer cette réussite dans les cas correspondants. Ici, le bouton représente un lien déjà validé pour le prototype.'},
      {id:'E7',name:'Démo',step:4,title:'Découvrez une version de votre présence.',lede:'Lien privé sans compte ni paiement. La démo est présentée après validation opérateur.',main:()=>`<div class="demo-preview"><div class="demo-image" role="img" aria-label="Rocher couvert de mousse dans une forêt humide"></div><div class="demo-copy"><span class="eyebrow">Aperçu privé</span><strong>Établissement exemple A</strong><p>Une première lecture du lieu, des informations utiles et un contact simple.</p></div></div><div class="meta-list"><div><dt>Accès</dt><dd>Validation opérateur confirmée</dd></div><div><dt>Expiration</dt><dd class="expiry">Lien temporaire, sans alarme</dd></div></div><div class="action-row"><button class="primary" data-next="E0">Mettre mon site en ligne</button><a class="secondary" href="#">Appeler</a></div>`,side:'Les actions de contact restent regroupées selon les données disponibles. La mise en ligne n’apparaît qu’après la découverte, sans concurrencer les contacts.'}
    ];
    let current='E0';
    const app=document.querySelector('#app');const select=document.querySelector('#screen');
    screens.forEach(s=>{const option=document.createElement('option');option.value=s.id;option.textContent=`${s.id} · ${s.name}`;select.append(option)});
    function progress(active){return ['Identifier','Comprendre','Auditer','Préparer','Découvrir'].map((label,index)=>`<span class="progress-item ${index<active?'done ':''}${index===active?'current':''}">${label}</span>`).join('')}
    function render(id){current=id;select.value=id;const screen=screens.find(s=>s.id===id);app.innerHTML=`<header class="brand-row"><span class="brand">ANCRAGE</span><span class="eyebrow">prototype public E0 à E7</span></header><div class="progress" aria-label="Progression du parcours">${progress(screen.step)}</div><div class="layout"><section class="main"><div class="eyebrow">${screen.id} · ${screen.name}</div><h1>${screen.title}</h1><p class="lede">${screen.lede}</p>${screen.main()}<p class="stage-copy"><strong>Question de cet écran :</strong> où en suis-je, pourquoi cette étape existe-t-elle et quel est le prochain geste utile ?</p></section><aside class="panel side-note"><div class="eyebrow">Règle observée</div><p>${screen.side}</p></aside></div>`;bind()}
    function bind(){document.querySelectorAll('[data-next]').forEach(button=>button.addEventListener('click',event=>{event.preventDefault();render(button.dataset.next)}));document.querySelectorAll('[data-choice]').forEach(choice=>choice.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(item=>item.setAttribute('aria-checked','false'));choice.setAttribute('aria-checked','true');document.querySelector('#confirm').disabled=false}));const launch=document.querySelector('#launch');if(launch)launch.addEventListener('click',()=>{const email=document.querySelector('#email').value.trim();const error=document.querySelector('#email-error');if(!email.includes('@')){error.classList.remove('hidden');return}render('E6')})}
    select.addEventListener('change',()=>render(select.value));render(current);
  </script>
</body>
</html>
