<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ancrage — cockpit opérateur V3</title>
  <style>
    @font-face{font-family:Jet;src:url('../sstr-direction/assets/JetBrainsMono[wght].woff2')}
    :root{--bg:#0d120e;--panel:#162117;--panel2:#243226;--ink:#e9eee4;--muted:#87968a;--line:#2d392f;--field:#101710;--moss:#b8ce98;--warn:#e4c178;--block:#efaaa0;--violet:#cdbbe0;font:12px/1.45 Jet,monospace;color:var(--ink);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);overflow-x:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:190px minmax(270px,320px) minmax(0,1fr);min-height:100vh;gap:1px;background:var(--line)}.side,.list,.detail{background:#111811;min-width:0}.side{padding:18px 12px;display:flex;flex-direction:column}.brand{border:0;background:transparent;color:var(--ink);text-align:left;font-size:19px;letter-spacing:-.08em;padding:4px 10px 28px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.1em;margin-top:5px}.group,.eyebrow,.section-label{color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.group{padding:10px}.nav{display:grid;gap:2px}.nav button,.row{border:1px solid transparent;background:transparent;color:#aeb9ae;text-align:left;padding:9px;border-radius:4px}.nav button{display:flex;gap:8px;align-items:center}.nav button:hover,.nav button.active,.row:hover,.row.active{background:var(--panel2);color:#f3f6ed}.nav button.active{box-shadow:inset 2px 0 var(--moss)}.nav-icon{width:16px;color:var(--muted)}.nav button.active .nav-icon{color:var(--moss)}.foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px;color:var(--muted);font-size:10px}.ok,.pass{color:var(--moss)}.warn{color:var(--warn)}.block{color:var(--block)}.violet{color:var(--violet)}.list{padding:22px 15px;overflow:auto}.head,.rowtop,.meta,.inspect-head,.actions{display:flex;justify-content:space-between;gap:10px;align-items:start}.h1{font-size:22px;letter-spacing:-.08em;margin:5px 0 18px}.search,.field input,.field textarea,.field select{width:100%;background:var(--field);border:1px solid #415143;color:var(--ink);border-radius:3px;padding:8px}.search{margin-bottom:10px}.section-label{padding:12px 4px 5px}.row{width:100%;margin-bottom:3px}.row strong{font-size:12px}.meta{font-size:10px;color:var(--muted);margin-top:4px}.status{font-size:9px;text-transform:uppercase;white-space:nowrap}.detail{padding:25px 30px;overflow:auto;background:linear-gradient(145deg,#182219,#101610 72%)}.detail-inner{max-width:920px;min-width:0}.inspect-head{border-bottom:1px solid #415143;padding-bottom:18px}.inspect-head h2{font-size:25px;letter-spacing:-.08em;margin:5px 0 3px}.muted{color:var(--muted)}.actions{flex-wrap:wrap}.btn{border:1px solid #415143;border-radius:3px;background:#141d15;color:#dce5d8;padding:7px 9px}.btn.primary{background:var(--moss);border-color:var(--moss);color:#162016;font-weight:700}.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:18px 0;overflow-x:auto}.tabs button{flex:0 0 auto;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:8px 0;white-space:nowrap}.tabs button.active{border-color:var(--moss);color:var(--ink)}.facts{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}.fact{padding:11px 0}.fact+.fact{border-left:1px solid var(--line);padding-left:12px}.fact small{display:block;color:var(--muted);font-size:9px}.fact strong{display:block;margin-top:3px}.panel,.notice{border:1px solid #415143;background:var(--panel);padding:14px;margin-top:10px}.notice{border-left:2px solid var(--moss);color:#aeb9ae}.notice.warn{border-color:var(--warn)}.system-hero{border-left:2px solid var(--moss);padding-left:12px;margin:2px 0 18px}.system-hero p{color:#aeb9ae;max-width:760px;margin:7px 0 0}.system-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.system-grid .panel{margin-top:0}.system-grid strong{display:block;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px;margin:10px 0}.field label{color:#aeb9ae}.field textarea{min-height:130px;resize:vertical}.code{font:11px/1.55 Jet,monospace;white-space:pre-wrap;color:#dce5d8;background:#0d130f;border:1px solid var(--line);border-radius:3px;padding:11px;overflow:auto}.table{display:block;width:100%;overflow-x:auto;border-collapse:collapse}.table td,.table th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}.table th{color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:400}.step{padding:9px 0;border-bottom:1px solid #ffffff0d;color:#aeb9ae}.step:last-child{border-bottom:0}.step b{color:var(--moss);margin-right:8px}.route{display:grid;grid-template-columns:1.2fr 1fr 1fr 90px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff0d}.route:last-child{border-bottom:0}.route small{color:var(--muted)}.system-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.toast{position:fixed;right:20px;bottom:20px;background:var(--moss);color:#162016;padding:10px 12px;border-radius:3px;opacity:0;transform:translateY(8px);transition:.16s ease;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:850px){.app{grid-template-columns:58px 270px minmax(0,1fr)}.brand{font-size:0;text-align:center;padding:4px 0 28px}.brand:after{content:'a';font-size:22px;color:var(--moss)}.brand small,.group,.nav-label,.foot{display:none}.nav button{justify-content:center}.detail{padding:20px}.facts{grid-template-columns:1fr 1fr}.system-grid{grid-template-columns:1fr 1fr}.route{grid-template-columns:1fr 1fr}}@media(max-width:620px){.app{display:block}.side{height:58px;position:sticky;top:0;z-index:2;display:grid;grid-template-columns:52px repeat(6,minmax(0,1fr));padding:6px 5px;align-items:center}.brand{grid-column:1;padding:0}.side .nav{display:contents}.side .nav button{padding:8px 4px;min-width:0}.list{max-height:38vh;overflow-y:auto}.detail{min-height:62vh}.inspect-head{display:block}.actions{margin-top:12px}.grid,.system-grid{grid-template-columns:1fr}.route{grid-template-columns:1fr}.system-actions .btn{flex:1}}
    .provider-page{max-width:760px}.provider-head{padding:2px 0 17px;border-bottom:1px solid var(--line)}.provider-head h2{font-size:24px;letter-spacing:-.07em;margin:5px 0 4px}.provider-head p{margin:0;color:#aeb9ae}.connection-list{margin-top:16px;border-top:1px solid #415143}.connection-row{display:grid;grid-template-columns:30px minmax(0,1fr) 34px;align-items:center;gap:11px;min-height:54px;border-bottom:1px solid var(--line)}.provider-mark{display:grid;place-items:center;width:26px;height:26px;border:1px solid #526054;border-radius:50%;color:#f4f6f0;font-size:9px;font-weight:700}.connection-name{display:grid;gap:2px}.connection-name strong{font-size:12px}.connection-name span{color:var(--muted);font-size:10px}.connection-toggle{position:relative;width:30px;height:18px;padding:0;border:1px solid #5e685f;border-radius:999px;background:transparent}.connection-toggle span{position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:50%;background:#8c968e;transition:.14s ease}.connection-toggle.on{border-color:#e8ede5;background:#e8ede5}.connection-toggle.on span{left:15px;background:#111811}.connection-toggle:focus-visible,.add-button:focus-visible,.add-connection input:focus-visible,.add-connection select:focus-visible{outline:2px solid var(--moss);outline-offset:2px}.add-connection{display:grid;grid-template-columns:180px minmax(220px,1fr) 34px;gap:8px;align-items:end;margin-top:22px;padding:13px;border:1px solid #536055;background:#f1f3ee;color:#182019;border-radius:4px}.add-connection label{display:block;margin-bottom:5px;color:#59625b;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.add-connection select,.add-connection input{width:100%;height:34px;border:1px solid #bcc2bd;border-radius:3px;background:#fff;color:#151a16;padding:0 9px}.add-button{position:relative;width:34px;height:34px;border:0;border-radius:50%;background:#182019}.add-button:before,.add-button:after{content:"";position:absolute;left:10px;top:16px;width:14px;height:2px;background:#fff;border-radius:2px}.add-button:after{transform:rotate(90deg)}.add-connection small{grid-column:1/-1;color:#707871;font-size:9px}.provider-footnote{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;margin:13px 0}.tiny-dot{width:6px;height:6px;border-radius:50%;background:var(--moss)}@media(max-width:620px){.add-connection{grid-template-columns:1fr 34px}.add-provider-select,.add-key{grid-column:1}.add-button{grid-column:2;grid-row:1/3;align-self:center}.add-connection small{grid-column:1/-1}}
  </style>
</head>
<body>
  <div class="app"><aside class="side"><button class="brand" id="home" title="Accueil Ancrage" aria-label="Accueil Ancrage">ANCRAGE<small>COCKPIT · V3 · SYSTÈME</small></button><div class="group">Opérations</div><nav class="nav" id="ops"></nav><div class="group">Contrôle</div><nav class="nav" id="control"></nav><div class="foot">Prototype local<br><span class="ok">Fixtures · aucune mutation réelle</span></div></aside><section class="list" id="list"></section><main class="detail" id="detail"></main></div><div class="toast" id="toast" role="status"></div>
  <script>
    const nav=[['inbox','À traiter'],['runs','Runs'],['dossiers','Dossiers'],['agents','Agents'],['quality','Qualité'],['system','Système']];
    const sys=[['ProviderConnection','Connexions providers','OpenAI · OpenRouter · Ollama · MLX','ACTIF'],['ModelProfile','Profils de modèles','capacité · coût · contexte · données','ACTIF'],['Outils & MCP','Registre des outils','MCP · CLI · browser · permissions','WARN'],['AIRoutingPolicy','Politiques de routage','déterministe · local · cloud · humain','ACTIF'],['Budgets','Budgets & alertes','appel · étape · run · période','WARN'],['Profils CLI','Profils d’exécution','Screaming Frog · crawler · QA','ACTIF'],['Synchronisation','CloudIntakeInbox','curseur · hash · reprise · purge','PARTIAL']];
    const registry={ProviderConnection:{label:'Connexions providers',purpose:'Ajouter et activer les connexions que les agents peuvent utiliser.',tabs:[]},ModelProfile:{label:'Profil de modèle',purpose:'Décrire ce qu’un modèle sait faire, ce qu’il coûte et pour quelles tâches il est autorisé.',tabs:[['overview','Profil'],['capabilities','Capacités'],['usage','Usages autorisés'],['versions','Versions']]},'Outils & MCP':{label:'Outils & MCP',purpose:'Déclarer les outils qu’un agent peut appeler et la frontière d’approbation de chaque action.',tabs:[['overview','Registre'],['permissions','Permissions'],['manifest','Manifest'],['versions','Versions']]},AIRoutingPolicy:{label:'Politique de routage',purpose:'Choisir le chemin le moins coûteux et suffisamment capable, avec fallback explicite et traçable.',tabs:[['overview','Politique'],['matrix','Matrice agents'],['simulate','Simuler'],['versions','Versions']]},Budgets:{label:'Budgets',purpose:'Préautoriser une enveloppe et arrêter proprement les dépenses non autorisées.',tabs:[['overview','Limites'],['alerts','Alertes'],['events','CostEvents'],['versions','Versions']]},'Profils CLI':{label:'Profil CLI',purpose:'Préparer une commande locale contrôlée avec limites, dossier isolé et preuves attendues.',tabs:[['overview','Profil'],['command','Commande'],['sandbox','Sandbox'],['versions','Versions']]},Synchronisation:{label:'Synchronisation',purpose:'Importer les dossiers et preuves de façon idempotente, vérifiable et reprenable.',tabs:[['overview','État'],['intake','Intake'],['retention','Conservation'],['logs','Journal']]} };
    let current='inbox',selected=0,tab='overview',toastTimer;const $=s=>document.querySelector(s);const providerConnections=[{name:'OpenAI',mark:'OA',active:true,ending:'Clé ajoutée'},{name:'Anthropic',mark:'AN',active:false,ending:'Clé ajoutée'},{name:'OpenRouter',mark:'OR',active:true,ending:'Clé ajoutée'},{name:'OmniRoute',mark:'OM',active:false,ending:'Non configurée'}];function badge(s){return `<span class="status ${s==='ACTIF'||s==='PASS'||s==='READY'?'pass':s==='BROUILLON'||s==='INACTIF'?'violet':s==='WARN'||s==='PARTIAL'||s==='VIDE'?'warn':'block'}">${s}</span>`}function notify(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
    nav.forEach(([id,label])=>{const b=document.createElement('button');b.dataset.id=id;b.innerHTML=`<span class="nav-icon">${id==='inbox'?'◉':id==='runs'?'↻':id==='dossiers'?'□':id==='agents'?'◇':id==='quality'?'✓':'⌁'}</span><span class="nav-label">${label}</span>`;b.onclick=()=>{current=id;selected=0;tab='overview';render()};(id==='inbox'||id==='runs'||id==='dossiers'?$('#ops'):$('#control')).append(b)});$('#home').onclick=()=>{current='inbox';selected=0;render()};
    function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===current));current==='system'?systemPage():simplePage()}
    function simplePage(){const labels={inbox:'À traiter',runs:'Runs',dossiers:'Dossiers',agents:'Agents',quality:'Qualité'};$('#list').innerHTML=`<div class="eyebrow">Surface conservée pour comparaison</div><div class="h1">${labels[current]}</div><div class="notice">La V3 concentre cette itération sur le registre Système. Les surfaces existantes restent disponibles dans <a href="cockpit-operator-v2.html">V2</a>.</div>`;$('#detail').innerHTML=`<div class="detail-inner"><div class="system-hero"><strong>${labels[current]}</strong><p>Cette page est conservée comme point de comparaison. Ouvre <b>Système</b> pour parcourir les registres spécialisés.</p></div><button class="btn primary" onclick="current='system';selected=0;tab='overview';render()">Ouvrir Système</button></div>`}
    function rows(){return sys.map((x,i)=>`<button class="row ${i===selected?'active':''}" onclick="selected=${i};tab='overview';systemPage()"><div class="rowtop"><strong>${x[0]}</strong>${badge(x[3])}</div><div class="meta"><span>${x[1]}</span><span>${x[2]}</span></div></button>`).join('')}
    function shell(x,m,body){if(x[0]==='ProviderConnection')return `<div class="detail-inner provider-page"><header class="provider-head"><div><div class="eyebrow">Système · accès IA</div><h2>Connexions providers</h2><p>Ajoute une clé, puis active les providers disponibles pour tes agents.</p></div></header><div id="notice" class="notice" hidden></div>${body}</div>`;return `<div class="detail-inner"><header class="inspect-head"><div><div class="eyebrow">Système · ${m.label} · fixture locale</div><h2>${x[0]}</h2><div class="muted">${x[1]} · ${x[2]}</div></div><div class="actions"><button class="btn primary" onclick="action('${m.label} : brouillon préparé')">Créer un brouillon</button><button class="btn" onclick="action('${m.label} : test local préparé')">Tester</button></div></header><nav class="tabs">${m.tabs.map(([id,l])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';systemPage()">${l}</button>`).join('')}</nav><div id="notice" class="notice" hidden></div>${body}<div class="notice">Prototype local : aucun provider, outil, fichier ou synchronisation réelle n’est appelé.</div></div>`}
    function systemPage(){const x=sys[selected]||sys[0],m=registry[x[0]];$('#list').innerHTML=`<div class="eyebrow">Contrôle · socle partagé</div><div class="head"><div class="h1">Système</div><span class="status pass">${sys.length} registres</span></div><input class="search" placeholder="Rechercher un provider, modèle ou politique"><div class="section-label">Registres partagés</div>${rows()}`;$('#detail').innerHTML=shell(x,m,detail(x[0],m))}
    function intro(m,title){return `<div class="system-hero"><strong>${title||m.label}</strong><p>${m.purpose}</p></div>`}
    function detail(kind,m){if(kind==='ProviderConnection')return provider(m);if(kind==='ModelProfile')return model(m);if(kind==='Outils & MCP')return tools(m);if(kind==='AIRoutingPolicy')return routing(m);if(kind==='Budgets')return budgets(m);if(kind==='Profils CLI')return cli(m);return sync(m)}
    function provider(){return `<section class="connection-list" aria-label="Connexions configurées">${providerConnections.map((p,i)=>`<div class="connection-row"><span class="provider-mark" aria-hidden="true">${p.mark}</span><div class="connection-name"><strong>${p.name}</strong><span>${p.ending}</span></div><button class="connection-toggle ${p.active?'on':''}" type="button" aria-pressed="${p.active}" aria-label="${p.active?'Désactiver':'Activer'} ${p.name}" onclick="toggleProvider(${i})"><span></span></button></div>`).join('')}</section><form class="add-connection" onsubmit="addProvider(event)"><div class="add-provider-select"><label for="provider-select">Provider</label><select id="provider-select"><option>OpenAI</option><option>Anthropic</option><option>OpenRouter</option><option>OmniRoute</option><option>Autre endpoint compatible</option></select></div><div class="add-key"><label for="provider-key">Clé API</label><input id="provider-key" type="password" autocomplete="off" placeholder="sk-••••••••••••" aria-describedby="key-help"></div><button class="add-button" type="submit" aria-label="Ajouter la connexion"></button><small id="key-help">La clé est masquée et oubliée au rechargement dans ce prototype.</small></form><p class="provider-footnote"><span class="tiny-dot"></span>Seules les connexions activées seront proposées dans la configuration des agents.</p>`}
    function toggleProvider(index){providerConnections[index].active=!providerConnections[index].active;systemPage();notify(`${providerConnections[index].name} ${providerConnections[index].active?'activé':'désactivé'}`)}
    function addProvider(event){event.preventDefault();const select=$('#provider-select'),key=$('#provider-key'),name=select.value,raw=key.value.trim();if(!raw){key.focus();action('Entre une clé API avant d’ajouter la connexion');return}const existing=providerConnections.find(p=>p.name===name);const ending=`•••• ${raw.slice(-4).toUpperCase()}`;if(existing){existing.ending=ending;existing.active=true}else{providerConnections.push({name,mark:name.slice(0,2).toUpperCase(),active:true,ending})}systemPage();notify(`${name} ajouté et activé`)}
    function model(m){if(tab==='capabilities')return intro(m,'Capacités mesurées')+`<table class="table"><tr><th>Capacité</th><th>Valeur</th><th>Preuve</th></tr><tr><td>Contexte</td><td>32k tokens</td><td>Fiche v4</td></tr><tr><td>Structured output</td><td>${badge('PASS')}</td><td>SchemaContractValidator</td></tr><tr><td>Vitesse locale</td><td>42 tok/s</td><td>Mesure fixture</td></tr><tr><td>Coût</td><td>0,00 € local</td><td>CostEvent requis</td></tr></table>`;if(tab==='usage')return intro(m,'Usages autorisés')+`<div class="panel"><label><input type="checkbox" checked> Classification et extraction</label><br><label><input type="checkbox" checked> Reformulation contrainte</label><br><label><input type="checkbox" checked> Traduction</label><br><label><input type="checkbox"> Synthèse ambiguë</label><br><label><input type="checkbox"> Secrets ou données privées</label></div><div class="section-label">Agents autorisés</div><table class="table"><tr><th>Agent</th><th>Tâche</th><th>Route</th></tr><tr><td>EstablishmentMatcher</td><td>Rapprochement</td><td>local-small</td></tr><tr><td>ContentSEOAnalyzer</td><td>Analyse contenu</td><td>local-small</td></tr><tr><td>Copywriter</td><td>Rédaction contrainte</td><td>cloud-small sur confirmation</td></tr></table>`;if(tab==='versions')return `<div class="section-label">Versions du profil</div><table class="table"><tr><th>Version</th><th>Connexion</th><th>Classe</th><th>État</th></tr><tr><td>v4</td><td>Ollama</td><td>local-small</td><td>${badge('ACTIF')}</td></tr><tr><td>v3</td><td>Ollama</td><td>local-small</td><td>archivée</td></tr></table>`;return intro(m,'Profil disponible pour les agents')+`<section class="facts"><div class="fact"><small>Modèle</small><strong>llama3.1:8b</strong></div><div class="fact"><small>Provider</small><strong>Ollama local</strong></div><div class="fact"><small>Classe</small><strong>local-small</strong></div><div class="fact"><small>État</small><strong>${badge('ACTIF')}</strong></div></section><div class="panel"><div class="grid"><div class="field"><label>Identifiant exact</label><input value="llama3.1:8b"></div><div class="field"><label>Classe de routage</label><select><option>local-small</option><option>cloud-small</option><option>premium · confirmation</option></select></div><div class="field"><label>Contexte maximum</label><input value="32768 tokens"></div><div class="field"><label>Température autorisée</label><input value="0 · déterministe préféré"></div></div></div>`}
    function tools(m){if(tab==='permissions')return intro(m,'La permission porte sur l’action')+`<table class="table"><tr><th>Outil</th><th>Accès</th><th>Approbation</th><th>État</th></tr><tr><td>PublicSourceLookup</td><td>read</td><td>automatique</td><td>${badge('PASS')}</td></tr><tr><td>Playwright</td><td>inspect</td><td>avant navigation externe</td><td>${badge('WARN')}</td></tr><tr><td>Shell / CLI</td><td>execute</td><td>avant commande</td><td>${badge('WARN')}</td></tr><tr><td>Local file write</td><td>write</td><td>toujours</td><td>${badge('BLOCK')}</td></tr></table>`;if(tab==='manifest')return intro(m,'Manifest MCP · brouillon éditable')+`<div class="field"><label>Configuration à valider</label><textarea class="code">{\n  "name": "ancrage-tools",\n  "servers": {\n    "local-source": { "transport": "stdio", "command": "ancrage-source" }\n  }\n}</textarea></div><div class="system-actions"><button class="btn primary" onclick="action('Manifest validé : schéma local compatible')">Valider le manifest</button><button class="btn" onclick="action('tools-manifest.v1.md préparé')">Créer le fichier .md</button></div>`;if(tab==='versions')return `<div class="section-label">Versions et permissions</div><table class="table"><tr><th>Version</th><th>Outils</th><th>État</th></tr><tr><td>v2</td><td>3 outils · 1 approbation</td><td>${badge('ACTIF')}</td></tr><tr><td>v3</td><td>4 outils · 2 approbations</td><td>${badge('BROUILLON')}</td></tr></table>`;return intro(m,'Registre des capacités d’action')+`<section class="facts"><div class="fact"><small>Outils</small><strong>4 enregistrés</strong></div><div class="fact"><small>Lecture</small><strong>2 autorisés</strong></div><div class="fact"><small>Exécution</small><strong>2 approuvées</strong></div><div class="fact"><small>État</small><strong>${badge('WARN')}</strong></div></section><div class="panel"><div class="route"><strong>PublicSourceLookup</strong><small>source publique</small><small>read</small>${badge('PASS')}</div><div class="route"><strong>SchemaValidator</strong><small>contrat de sortie</small><small>execute</small>${badge('PASS')}</div><div class="route"><strong>Playwright</strong><small>rendu et QA</small><small>inspect</small>${badge('WARN')}</div></div>`}
    function routing(m){if(tab==='matrix')return intro(m,'Quel agent peut utiliser quel modèle ?')+`<div class="panel"><div class="route"><strong>EstablishmentMatcher</strong><small>rapprochement</small><span>déterministe → local-small</span>${badge('ACTIF')}</div><div class="route"><strong>ContentSEOAnalyzer</strong><small>audit contenu</small><span>local-small → cloud-small approuvé</span>${badge('ACTIF')}</div><div class="route"><strong>Copywriter</strong><small>rédaction</small><span>local-small → cloud sur confirmation</span>${badge('WARN')}</div><div class="route"><strong>SEOAcceptanceReviewer</strong><small>QA</small><span>déterministe → humain</span>${badge('ACTIF')}</div></div>`;if(tab==='simulate')return intro(m,'Simulation avant exécution')+`<div class="panel"><div class="grid"><div class="field"><label>Agent</label><select><option>ContentSEOAnalyzer</option><option>Copywriter</option><option>EstablishmentMatcher</option></select></div><div class="field"><label>Tâche</label><select><option>Analyse de contenu autorisé</option><option>Rédaction contrainte</option><option>Rapprochement</option></select></div><div class="field"><label>Données</label><select><option>Publiques · cloud possible</option><option>Local-only</option><option>Secrets · bloqué</option></select></div><div class="field"><label>Budget restant</label><input value="0,10 €" readonly></div></div><button class="btn primary" onclick="action('Route simulée : déterministe → Ollama local-small · aucun fallback requis')">Simuler la route</button></div><div class="notice warn">Fallback premium silencieux interdit. Sans route autorisée : BLOCK ou décision humaine.</div>`;if(tab==='versions')return `<div class="section-label">Versions de politique</div><table class="table"><tr><th>Version</th><th>Règle</th><th>État</th></tr><tr><td>v5</td><td>déterministe → local → cloud approuvé → humain</td><td>${badge('ACTIF')}</td></tr><tr><td>v4</td><td>local-first · budgets v2</td><td>archivée</td></tr></table>`;return intro(m,'Le routage est une décision traçable')+`<section class="facts"><div class="fact"><small>Politique</small><strong>local-first-small-v4</strong></div><div class="fact"><small>Fallback</small><strong>même classe uniquement</strong></div><div class="fact"><small>Premium</small><strong>confirmation requise</strong></div><div class="fact"><small>État</small><strong>${badge('ACTIF')}</strong></div></section><div class="panel"><div class="step done"><b>1</b>Règle déterministe suffisante</div><div class="step done"><b>2</b>Modèle local de capacité suffisante</div><div class="step"><b>3</b>Cloud approuvé de même classe</div><div class="step"><b>4</b>Revue humaine si ambiguïté</div></div>`}
    function budgets(m){if(tab==='alerts')return intro(m,'Les alertes annoncent, le plafond dur bloque')+`<table class="table"><tr><th>Périmètre</th><th>50 %</th><th>80 %</th><th>100 %</th><th>Action</th></tr><tr><td>Run courant</td><td>info</td><td>${badge('WARN')}</td><td>${badge('BLOCK')}</td><td>Inspecter</td></tr><tr><td>Cloud mensuel</td><td>info</td><td>${badge('WARN')}</td><td>${badge('BLOCK')}</td><td>Confirmation</td></tr></table>`;if(tab==='events')return `<div class="section-label">CostEvents · lecture et provenance</div><table class="table"><tr><th>Événement</th><th>Agent</th><th>Provider</th><th>Montant</th><th>État</th></tr><tr><td>RUN-024-12</td><td>ContentSEOAnalyzer</td><td>Ollama</td><td>0,04 € estimé</td><td>${badge('PASS')}</td></tr><tr><td>RUN-021-09</td><td>Copywriter</td><td>OpenRouter</td><td>0,22 € confirmé</td><td>${badge('WARN')}</td></tr></table>`;if(tab==='versions')return `<div class="section-label">Versions de budgets</div><table class="table"><tr><th>Version</th><th>Plafond run</th><th>Arrêt</th><th>État</th></tr><tr><td>v2</td><td>0,80 €</td><td>100 %</td><td>${badge('ACTIF')}</td></tr><tr><td>v1</td><td>0,50 €</td><td>100 %</td><td>archivée</td></tr></table>`;return intro(m,'Une enveloppe mesurable par étape')+`<section class="facts"><div class="fact"><small>Run</small><strong>0,80 €</strong></div><div class="fact"><small>Étape</small><strong>0,25 €</strong></div><div class="fact"><small>Alertes</small><strong>50 · 80 · 100 %</strong></div><div class="fact"><small>État</small><strong>${badge('WARN')}</strong></div></section><div class="panel"><div class="grid"><div class="field"><label>Plafond par run</label><input value="0,80 €"></div><div class="field"><label>Plafond cloud mensuel</label><input value="10,00 €"></div><div class="field"><label>À 80 %</label><select><option>Réduire les étapes optionnelles</option><option>Demander confirmation</option></select></div><div class="field"><label>À 100 %</label><select><option>Arrêt dur</option><option>Confirmation explicite</option></select></div></div></div>`}
    function cli(m){if(tab==='command')return intro(m,'Commande préparée, jamais exécutée implicitement')+`<div class="field"><label>Commande calculée</label><textarea class="code">screamingfrogseospider --crawl https://example.test \\\n  --headless --save-crawl ./runs/RUN-024/crawl.sf</textarea></div><div class="system-actions"><button class="btn primary" onclick="action('Commande validée syntaxiquement · aucune exécution')">Valider la commande</button><button class="btn" onclick="action('runbook/RUN-024-command.md préparé')">Créer le point .md</button></div>`;if(tab==='sandbox')return intro(m,'Limites d’exécution')+`<div class="system-grid"><div class="panel"><small class="muted">Dossier</small><strong>./runs/RUN-024/</strong><span class="muted">écriture isolée</span></div><div class="panel"><small class="muted">Réseau</small><strong>site cible uniquement</strong><span class="muted">ports autorisés</span></div><div class="panel"><small class="muted">Durée</small><strong>15 min</strong><span class="muted">timeout contrôlé</span></div></div><div class="notice warn">Licence, SSRF et arrêt restent des gates de production à vérifier.</div>`;if(tab==='versions')return `<div class="section-label">Versions de profil CLI</div><table class="table"><tr><th>Version</th><th>Outil</th><th>Limites</th><th>État</th></tr><tr><td>v3</td><td>Screaming Frog</td><td>15 min · isolé</td><td>${badge('ACTIF')}</td></tr><tr><td>v2</td><td>crawler interne</td><td>10 min · local</td><td>archivée</td></tr></table>`;return intro(m,'Profil d’exécution local')+`<section class="facts"><div class="fact"><small>Outil</small><strong>Screaming Frog</strong></div><div class="fact"><small>Étapes</small><strong>Crawl · QA</strong></div><div class="fact"><small>État</small><strong>${badge('ACTIF')}</strong></div><div class="fact"><small>Mode</small><strong>CLI contrôlé</strong></div></section><div class="panel"><div class="grid"><div class="field"><label>Exécutable</label><input value="screamingfrogseosp     function sync(m){if(tab==='intake')return intro(m,'Importer sans perdre ni doubler')+`<table class="table"><tr><th>Élément</th><th>État</th><th>Action</th></tr><tr><td>CloudIntakeInbox/024</td><td>${badge('READY')}</td><td>Importer</td></tr><tr><td>CloudIntakeInbox/023</td><td>${badge('PARTIAL')}</td><td>Reprendre</td></tr><tr><td>CloudIntakeInbox/021</td><td>${badge('BLOCK')}</td><td>Inspecter</td></tr></table><button class="btn primary" onclick="action('Import idempotent préparé · hash requis avant accusé')">Préparer l’import</button>`;if(tab==='retention')return intro(m,'Conserver localement après accusé')+`<div class="panel"><div class="grid"><div class="field"><label>Archive locale</label><input value="~/Ancrage/Archives chiffrées" readonly></div><div class="field"><label>Rétention R2</label><input value="suppression explicite + lifecycle" readonly></div><div class="field"><label>Mode hors ligne</label><select><option>Conserver et reprendre</option><option>Bloquer</option></select></div><div class="field"><label>Dernier backup</label><input value="il y a 18 min · vérifié" readonly></div></div></div>`;if(tab==='logs')return `<div class="section-label">Journal de synchronisation · lecture seule</div><table class="table"><tr><th>Heure</th><th>Événement</th><th>Preuve</th></tr><tr><td>09:14:02</td><td>Hash vérifié pour dossier 024</td><td>manifest.json</td></tr><tr><td>09:14:04</td><td>Écriture locale atomique terminée</td><td>sha256 concordant</td></tr><tr><td>09:14:05</td><td>Accusé R2 en attente</td><td>${badge('PARTIAL')}</td></tr></table>`;return intro(m,'État de la chaîne locale ↔ cloud')+`<section class="facts"><div class="fact"><small>Dernier import</small><strong>il y a 2 min</strong></div><div class="fact"><small>Hash</small><strong class="ok">Concordant</strong></div><div class="fact"><small>Hors ligne</small><strong>Reprise conservée</strong></div><div class="fact"><small>État</small><strong>${badge('PARTIAL')}</strong></div></section><div class="panel"><div class="step done"><b>✓</b>3 dossiers détectés</div><div class="step done"><b>✓</b>2 imports écrits localement</div><div class="step current"><b>●</b>1 accusé R2 à confirmer</div><div class="step"><b>○</b>Suppression R2 après preuve</div></div><div class="system-actions"><button class="btn primary" onclick="action('Vérification de hash préparée')">Vérifier les hashes</button><button class="btn" onclick="action('Reprise locale préparée pour 1 élément PARTIAL')">Reprendre</button></div>`}
